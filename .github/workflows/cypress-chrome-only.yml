name: Cypress Chrome CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-chrome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E — Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Publicar screenshots de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-chrome
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar vídeos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-chrome
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7
